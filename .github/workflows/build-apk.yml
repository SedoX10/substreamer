name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (Bare Release)
        run: npx expo prebuild --platform android --template bare-minimum --non-interactive

      - name: Disable R8/ProGuard to prevent freeze
        run: |
          echo "android.enableR8=false" >> android/gradle.properties
          echo "android.enableMinificationInReleaseBuilds=false" >> android/gradle.properties

      - name: Build Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x test -x minifyReleaseWithR8

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: substreamer-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
